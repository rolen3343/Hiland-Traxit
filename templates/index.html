<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hiland Dairy - Gallon Filler</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <nav class="navbar">
      <div class="app-name">TRAXIT</div>
      <button id="menuToggle" class="menu-toggle">≡</button>
    </nav>
    <div id="menuDropdown" class="menu-dropdown" style="display:none;">
      <a href="/" class="menu-item">📄 Run Sheet</a>
      <a href="/hours" class="menu-item">⏱️ Hours Tracker</a>
      <div class="menu-divider"></div>
      <button id="darkModeToggle" class="menu-item">🌙 Dark Mode</button>
    </div>
    <header class="topbar">
      <img src="/static/hiland.png" id="logo" alt="Hiland logo">
      <h1>Gallon Filler Worker: Austin.</h1>
    </header>
    <label>Date
      <input id="date" type="date">
    </label>
    <label>Shift Rate (Gallons/Hour)
      <input id="gallonsPerHour" type="number" min="0" value="1000" step="50">
    </label>

    <section class="ocr">
      <h2>Scan Run Sheet</h2>
      <p>Take a picture of the paper run sheet to auto-fill rows.</p>
      <div class="ocr-controls">
        <input id="runsheetImage" type="file" accept="image/*">
        <button id="scanRunsheet">Scan & Prefill</button>
      </div>
      <div id="imagePreview" style="margin-top:8px;"></div>
      <div id="ocrStatus" class="status"></div>
    </section>

    

    <div id="rows"></div>
    <div class="controls">
      <button id="addRow">Add Row</button>
      <button id="submit">Submit</button>
      <button id="clockIn" class="clock-btn" style="display:none;">🕒 Clock In</button>
      <button id="clockOut" class="clock-btn" style="display:none;">🕛 Clock Out</button>
      <a class="btn" id="export" href="/export">Export CSV</a>
      <button id="downtimeToggle" class="downtime-btn">⏸️ Start Downtime</button>
    </div>

    <section>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <h2 style="margin:0;">Run sheet Entries:</h2>
        <button id="refreshBtn" class="refresh-btn" title="Refresh from server">🔄 Refresh</button>
      </div>
      <div id="downtimeStatus" style="display:none;background:#ff6b6b;color:#fff;padding:8px;border-radius:4px;margin:8px 0;font-weight:600;text-align:center;"></div>
      <p id="startTime" style="font-size:0.9rem;color:#666;margin:4px 0 8px;"></p>
      <div id="entries"></div>
    </section>
  </main>
  <script src="/static/app.js?v=20260114"></script>
</body>
</html>
